services:
  postgres:
    image: postgres:15-alpine
    container_name: rpg3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpg3d
      POSTGRES_PASSWORD: rpg3d
      POSTGRES_DB: rpg3d
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: rpg3d-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
